name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The release workflow runs all of this before it publishes.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Check, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit test
        run: pnpm test

      - name: Build
        run: pnpm build

  go:
    name: Go package (vet, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...

      - run: go test ./...

  integration:
    # The same tests against the official binary with the JavaScript hooks, and against a
    # PocketBase built with Go and the pbcms package (tests/gopocketbase/).
    name: Integration test (PocketBase, ${{ matrix.pocketbase }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pocketbase: [official, go]
    env:
      PBCMS_POCKETBASE: ${{ matrix.pocketbase }}
    steps:
      - uses: actions/checkout@v7

      - if: matrix.pocketbase == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The tests download the PocketBase binary named in compose.yaml.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/pocketbase
          key: pocketbase-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compose.yaml') }}

      - run: pnpm test:integration

  e2e:
    name: E2E test (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/pocketbase
          key: pocketbase-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compose.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build

      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  package:
    # What a release publishes, built the same way. On a pull request the version is a placeholder.
    name: Release package (zip, image)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dev' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Pack the zip
        run: release/package.sh "$TAG"

      - name: Build the image
        run: |
          unzip -q "release-out/pocketbase-cms_${TAG#v}.zip" -d release-out/files
          docker build --file release/Dockerfile --tag pocketbase-cms:check release-out/files

      - name: Check COPY --from
        run: release/verify-image.sh pocketbase-cms:check build

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release-out/*.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7
